name: Auto-update NYX Vox Cask

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [nyx-vox-release]

permissions:
  contents: write

jobs:
  update-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap
        uses: actions/checkout@v4

      - name: Check and update NYX Vox cask
        run: |
          set -euo pipefail

          echo "Fetching latest release of NYX Vox..."
          RELEASE_JSON=$(curl -sSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/AVP-Dev/nyx-vox/releases/latest)
          LATEST_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          VERSION="${LATEST_TAG#v}"

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to retrieve latest tag name."
            exit 1
          fi

          CURRENT_VERSION=$(grep -E 'version "' Casks/nyx-vox.rb | head -n 1 | sed -E 's/.*version "([^"]+)".*/\1/')
          echo "Latest GitHub release: $VERSION"
          echo "Current Cask version:  $CURRENT_VERSION"

          if [ "$VERSION" = "$CURRENT_VERSION" ]; then
            echo "Cask is already up to date ($VERSION)."
            exit 0
          fi

          DMG_NAME="NYX.Vox_${VERSION}_aarch64.dmg"
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r --arg name "$DMG_NAME" '.assets[] | select(.name == $name) | .browser_download_url')

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "Asset $DMG_NAME not found in release assets."
            exit 1
          fi

          echo "Downloading $DMG_NAME to compute SHA256..."
          curl -sSL -o "$DMG_NAME" "$DOWNLOAD_URL"
          SHA256=$(sha256sum "$DMG_NAME" | awk '{print $1}')
          rm -f "$DMG_NAME"

          echo "Calculated SHA256: $SHA256"

          # Update Cask file
          sed -i -E "s/version \"[^\"]+\"/version \"$VERSION\"/" Casks/nyx-vox.rb
          sed -i -E "s/sha256 \"[^\"]+\"/sha256 \"$SHA256\"/" Casks/nyx-vox.rb

          # Commit & Push
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/nyx-vox.rb
          git commit -m "chore(cask): bump nyx-vox to $VERSION"
          git push
